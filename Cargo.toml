[package]
name = "rba"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "Rust BPM & Key Analyzer: A cross-platform tool that detects the tempo and the musical key of audio files"
license = "GPL-3.0"

[[bin]]
name = "rba"
path = "src/main.rs"

[lib]
name = "rba"
path = "src/lib.rs"

[dependencies]
# CLI parsing: args, --help/--version, usage errors, env fallbacks.
clap = { version = "4.5.61", features = ["derive", "env"] }
# Default decoder: pure-Rust demux + codec support for the common formats.
# Feature list = the formats the CLI's audio allow-list actually covers with
# a Symphonia codec (wma/ape/wv/... have no Symphonia decoder; those still
# need the ffmpeg fallback via RBA_USE_FFMPEG).
symphonia = { version = "0.6", default-features = false, features = [
    "aac", "aiff", "alac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav",
    "adpcm", "mkv",
] }
# Resampler for the Symphonia path (the original resamples to 44100 via the
# OS audio stack; ffmpeg has its own resampler built in).
rubato = "0.16" 
# Progress bar for directory mode (stderr, TTY only).
indicatif = "0.18.4"
# Parallel analysis of many files.
rayon = "1.10.0"
# Forward FFT. The engine only needs a 256-point transform, but rustfft is
# significantly faster than a hand-rolled radix-2 implementation on the hot
# path (one transform per 256-sample frame) and is SIMD-accelerated on
# aarch64/x86-64. See docs/03-implementation.md §2.3.
rustfft = "6.4"
# Error boilerplate.
thiserror = "2.0.20"
# Display width for the directory table (CJK-aware column alignment).
unicode-width = "0.2"
# Directory traversal for directory mode.
walkdir = "2.5.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = false
strip = true

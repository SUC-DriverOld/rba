# Manual release: dispatch with a bare version (e.g. 0.1.0). It tags
# v<version>, builds the three desktop platforms and publishes a GitHub
# release titled v<version> with one binary each:
#
#   rba-<ver>-windows-x64.exe
#   rba-<ver>-macOS-arm64
#   rba-<ver>-linux-x64
#
# The binary is self-contained (Symphonia decoder built in); no SDK, no
# runtime dependencies.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v prefix (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Owns tag + release creation so the build jobs never race on it.
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Normalize and validate the version
        id: ver
        run: |
          v="${{ inputs.version }}"
          v="${v#v}"
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must look like 0.1.0 (got '${{ inputs.version }}')"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "::error::tag v$v already exists"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
      - name: Create tag
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git tag -a "${{ steps.ver.outputs.tag }}" -m "Release ${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "${{ steps.ver.outputs.tag }}" \
            --notes "Release ${{ steps.ver.outputs.tag }}.

          - \`rba-${{ steps.ver.outputs.version }}-windows-x64.exe\`
          - \`rba-${{ steps.ver.outputs.version }}-macOS-arm64\`
          - \`rba-${{ steps.ver.outputs.version }}-linux-x64\`" \
            --repo "$GITHUB_REPOSITORY"

  build:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            ext: .exe
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macOS-arm64
            ext: ""
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            ext: ""
    runs-on: ${{ matrix.os }}
    env:
      VER: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Lib tests need no fixtures or external tools; the CLI integration
      # tests reference tests/fixtures/, which is not tracked in git.
      - name: Test
        run: cargo test --release --locked --target ${{ matrix.target }} --lib

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          t="target/${{ matrix.target }}/release"
          name="rba-$VER-${{ matrix.platform }}${{ matrix.ext }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$t/rba.exe" "$name"
          else
            cp "$t/rba" "$name"
            chmod +x "$name"
          fi
          # Smoke: the binary must at least identify itself.
          ./"$name" --version

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ needs.tag.outputs.tag }}"
          "rba-$VER-${{ matrix.platform }}${{ matrix.ext }}" --clobber --repo "$GITHUB_REPOSITORY"
